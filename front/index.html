<div class="container py-5">
  <h1 class="text-center mb-5"><i class="bi bi-people-fill me-2"></i>Gestión de Estudiantes</h1>

  <!-- Registrar estudiante -->
  <form class="mb-4 p-4 rounded shadow-sm formulario-transparente">
    <h2 class="text-white mb-4"><i class="bi bi-person-plus me-2"></i>Registrar Estudiante</h2>

    <div class="row g-3">
      <div class="col-md-6">
        <label for="registerName" class="form-label">Nombre completo</label>
        <input type="text" id="registerName" class="form-control" placeholder="Nombre y apellido" required />
      </div>

      <div class="col-md-6">
        <label for="registerDNI" class="form-label">DNI</label>
        <input type="text" id="registerDNI" class="form-control" placeholder="Número de documento" required />
      </div>

      <div class="col-md-6">
        <label for="registerCareer" class="form-label">Carrera</label>
        <select id="registerCareer" class="form-select" required>
          <option value="" selected disabled>Seleccione Carrera</option>
        </select>
      </div>

      <div class="col-md-6">
        <label for="registerEdad" class="form-label">Edad</label>
        <input type="number" id="registerEdad" class="form-control" placeholder="Edad en años" min="16" max="120" required />
      </div>

      <div class="col-12">
        <button type="button" class="btn btn-primary w-100 py-2" onclick="registerStudent()">
          <i class="bi bi-save me-2"></i>Registrar Estudiante
        </button>
      </div>
    </div>
  </form>

  <!-- Buscar estudiante por ID -->
  <form class="mb-4 p-4 rounded shadow-sm formulario-transparente">
    <h2 class="text-white mb-4"><i class="bi bi-search me-2"></i>Buscar Estudiante</h2>
    <div class="row g-3">
      <div class="col-md-9">
        <input type="number" id="studentId" class="form-control" placeholder="ID del estudiante" min="1" required />
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-primary w-100" onclick="getStudentById()">
          <i class="bi bi-search me-1"></i> Buscar
        </button>
      </div>
    </div>
  </form>

  <!-- Buscar estudiantes por carrera -->
  <form class="mb-4 p-4 rounded shadow-sm formulario-transparente">
    <h2 class="text-white mb-4"><i class="bi bi-funnel me-2"></i>Filtrar por Carrera</h2>
    <div class="row g-3">
      <div class="col-md-9">
        <select id="careerFilter" class="form-select" required>
          <option value="" selected disabled>Seleccione Carrera</option>
        </select>
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-primary w-100" onclick="getStudentsByCareer()">
          <i class="bi bi-funnel-fill me-1"></i> Filtrar
        </button>
      </div>
    </div>
  </form>

  <!-- Eliminar estudiante -->
  <form class="p-4 rounded shadow-sm formulario-transparente">
    <h2 class="text-white mb-4"><i class="bi bi-person-x me-2"></i>Eliminar Estudiante</h2>
    <div class="row g-3">
      <div class="col-md-9">
        <input type="number" id="deleteId" class="form-control" placeholder="ID del estudiante" min="1" required />
      </div>
      <div class="col-md-3">
        <button type="button" class="btn btn-danger w-100" onclick="deleteStudent()">
          <i class="bi bi-trash me-1"></i> Eliminar
        </button>
      </div>
    </div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
