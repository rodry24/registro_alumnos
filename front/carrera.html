<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de Carreras</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-glass">
  <div class="container-fluid px-4">
    <a class="navbar-brand" href="#">
      <img src="imag.png" alt="Logo" width="40" height="40" class="rounded-circle me-2">
      <span class="d-none d-sm-inline align-middle">ISFDyT N°57 - Gestión Estudiantil</span>
    </a>
    
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav gap-lg-4">
        <li class="nav-item">
          <a class="nav-link" href="inicio.html">
            <i class="bi bi-house-door me-1"></i> Inicio
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="index.html">
            <i class="bi bi-people me-1"></i> Estudiantes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="carrera.html">
            <i class="bi bi-book me-1"></i> Carreras
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="categorias.html">
            <i class="bi bi-tags me-1"></i> Categorías
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <h1 class="text-center mb-5"><i class="bi bi-book me-2"></i>Gestión de Carreras</h1>

  <!-- Formulario de registro mejorado -->
  <form id="careerForm" class="mb-4 p-4 rounded shadow-sm formulario-transparente">
    <h2 class="text-white mb-4">Registrar Nueva Carrera</h2>
    
    <div class="row g-3">
      <div class="col-md-6">
        <label for="careerName" class="form-label">Nombre de la carrera</label>
        <input type="text" id="careerName" class="form-control" placeholder="Ej: Licenciatura en Ciencia de Datos" required>
      </div>
      
      <div class="col-md-6">
        <label for="careerCode" class="form-label">Código único</label>
        <input type="text" id="careerCode" class="form-control" placeholder="Ej: LCD-2024" required>
      </div>
      
      <div class="col-md-6">
        <label for="careerCategory" class="form-label">Categoría</label>
        <select id="careerCategory" class="form-select" required>
          <option value="" selected disabled>Seleccione Categoría</option>
        </select>
      </div>
      
      <div class="col-md-6">
        <label for="careerDuration" class="form-label">Duración (años)</label>
        <input type="number" id="careerDuration" class="form-control" min="1" max="10" value="4" required>
      </div>
      
      <div class="col-12">
        <button type="button" class="btn btn-primary w-100 py-2" onclick="registerCareer()">
          <i class="bi bi-save me-2"></i>Registrar Carrera
        </button>
      </div>
    </div>
  </form>

  <!-- Lista de carreras mejorada -->
  <section id="careersListContainer" class="mb-4 p-4 rounded shadow-sm lista-transparente">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="text-white mb-0">
        <i class="bi bi-list-check me-2"></i>Carreras Registradas
      </h2>
      <button class="btn btn-sm btn-outline-light" onclick="loadCareersList()">
        <i class="bi bi-arrow-clockwise"></i> Actualizar
      </button>
    </div>
    
    <ul class="list-group list-group-flush">
      <!-- Las carreras se cargarán aquí dinámicamente -->
    </ul>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
